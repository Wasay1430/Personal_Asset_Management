<style>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=n=>"Rs "+Math.round(n).toLocaleString("en-US"),sum=a=>a.reduce((s,x)=>s+x.a,0),sm=(a,k)=>a.reduce((s,r)=>s+(+r[k]||0),0),pct=(a,b)=>b?Math.round(a/b*100):0;
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},td=today();
const addM=(d,m)=>{const x=new Date(d+"T00:00:00");x.setMonth(x.getMonth()+m);return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const mAdd=(m,k)=>addM(m+"-01",k).slice(0,7),days=d=>Math.round((new Date(d+"T00:00:00")-new Date(td+"T00:00:00"))/864e5);
let S={sh:{},q:[],cfg:{url:"",token:""},last:{}};try{Object.assign(S,JSON.parse(localStorage.getItem("asset_v1")))}catch(e){}
const save=()=>{try{localStorage.setItem("asset_v1",JSON.stringify(S))}catch(e){toast("Storage full!")}};
function toast(m){const t=$("#t");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1700)}
const FK={category_id:"Master_Categories",subcategory_id:"Master_Subcategories",payment_method_id:"Master_Payment_Methods",unit_id:"Master_Units",default_unit_id:"Master_Units",vehicle_id:"Master_Vehicles",vehicle_type_id:"Master_Vehicle_Types",fuel_type_id:"Master_Fuel_Types",fuel_station_id:"Master_Fuel_Stations",asset_id:"Master_Household_Assets",part_system_id:"Master_Parts_Systems",maintenance_category_id:"Master_Maint_Categories",maintenance_detail_id:"Master_Maint_Details",grocery_item_id:"Master_Grocery_Items",supplier_id:"Master_Suppliers",store_id:"Master_Stores"};
const TILES=[["General_Expenses","🧾","Kharcha"],["Transport_Fuel","⛽","Petrol"],["Transport_Maintenance","🔧","Gaari service"],["Household_Maintenance","🏠","Ghar/Asset"],["Grocery_Purchases","🛒","Grocery"],["Utilities","💡","Bill"],["Donations","🤲","Sadqa"],["Other_Income","💰","Income"],["Shopping_List","📝","Shopping list"]];
const AUTO=["quantity_litres","consumption","total_amount"],DN=["Itwaar","Peer","Mangal","Budh","Jumeraat","Jumma","Hafta"];
const R=n=>S.sh[n]?.rows||[],pkOf=n=>S.sh[n].cols[0],ncol=t=>S.sh[t].cols.find(c=>/name$/.test(c))||S.sh[t].cols[1],act=v=>String(v).toUpperCase()!=="FALSE";
const nm=(fk,id)=>{const t=FK[fk];if(!t||!S.sh[t]||id===""||id==null)return"";const r=R(t).find(r=>r[pkOf(t)]==id);return r?r[ncol(t)]:id};
const ctype=c=>/^is_/.test(c)?"b":/date$/i.test(c)?"d":/amount|quantity|price|reading|consumption|odometer|^year$/i.test(c)?"n":"t";
/* ---- icons ---- */
const G=['<path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.5A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/>','<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>','<rect x="5" y="4" width="9" height="16" rx="1.5"/><path d="M5 10h9M14 8h2.5A1.5 1.5 0 0 1 18 9.5V16a1.5 1.5 0 0 0 3 0V9l-3-3"/>','<path d="M3 4h2.5l2.2 10h9.6l2-7.5H6.5"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/>','<path d="M12 3l7 3v5c0 5-3.2 8.3-7 10-3.8-1.7-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>','<path d="M5 8h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M16 9h2a2.5 2.5 0 0 1 0 5h-2M8 3v2M12 3v2"/>','<circle cx="12" cy="12" r="8"/><path d="M12 7v10M9.5 9.5c0-1 1-1.7 2.5-1.7s2.5.7 2.5 1.7-1 1.5-2.5 1.8-2.5.8-2.5 1.8 1 1.7 2.5 1.7 2.5-.7 2.5-1.7"/>','<path d="M15 4a5 5 0 0 1 2 8.5l-3 2.5-5-5L11.5 7A5 5 0 0 1 15 4z"/><path d="M9 15l-4 4M5 16.5L7.5 19"/>','<rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9.5 17V7.5h3.2a2.7 2.7 0 0 1 0 5.4H9.5"/>','<path d="M4 15l1.6-5A2 2 0 0 1 7.5 8.6h9A2 2 0 0 1 18.4 10l1.6 5v3h-2.5v-1.5h-11V18H4z"/><circle cx="7.8" cy="14" r=".8"/><circle cx="16.2" cy="14" r=".8"/>','<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-4 3.6-6 7-6s6.2 2 7 6"/>','<path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>','<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.4 2.4-2.6-.6-.6-2.6z"/>'];
const GI=[/donat|sadqa|charity/i,/util|bill/i,/petrol|fuel/i,/groc/i,/guard/i,/daily|food/i,/loan/i,/meat/i,/park/i,/drive|ride|taxi/i,/yaseen|pion|salary|income/i,/maint|service|repair/i],GC=["#7c3aed","#f59e0b","#ea580c","#16a34a","#0ea5e9","#db2777","#6366f1","#dc2626","#0891b2","#9333ea","#0f766e","#475569"];
const ico=(n,z=30)=>{let i=GI.findIndex(r=>r.test(n||""));const h=[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0);return`<span class="ci" style="width:${z}px;height:${z}px;background:${GC[i>=0?i:h%GC.length]}"><svg viewBox="0 0 24 24" style="width:${z*.62}px;height:${z*.62}px">${G[i>=0?(i==11?12:i):11]}</svg></span>`};
/* ---- ledger ---- */
function ledger(){const L=[],a=(d,c,s,x,p,ds)=>{x=+x;if(d&&x&&c)L.push({d:String(d).slice(0,10),c,s:s||"-",a:x,p:p||"-",ds:ds||""})},P=r=>nm("payment_method_id",r.payment_method_id);
R("General_Expenses").forEach(r=>a(r.expense_date,nm("category_id",r.category_id),nm("subcategory_id",r.subcategory_id),r.amount,P(r),r.description));
R("Donations").forEach(r=>a(r.donation_date,"Donations","-",r.amount,P(r),r.note));
R("Utilities").forEach(r=>a(r.bill_date||r.payment_date,"Utility Bills",r.utility_type,r.amount,P(r),r.notes));
R("Grocery_Purchases").forEach(r=>a(r.purchase_date,"Groceries",nm("grocery_item_id",r.grocery_item_id),r.total_amount||r.quantity*r.unit_price,P(r),r.notes));
R("Transport_Fuel").forEach(r=>a(r.purchase_date,"Fuel",nm("vehicle_id",r.vehicle_id),r.amount,P(r),r.notes));
R("Transport_Maintenance").forEach(r=>a(r.service_date,"Gaari Maintenance",nm("vehicle_id",r.vehicle_id),r.amount,P(r),nm("maintenance_detail_id",r.maintenance_detail_id)));
R("Household_Maintenance").forEach(r=>a(r.service_date,"Ghar Maintenance",nm("asset_id",r.asset_id),r.amount,P(r),nm("maintenance_detail_id",r.maintenance_detail_id)));return L}
const income=()=>R("Other_Income").filter(r=>+r.amount&&r.income_date).map(r=>({d:String(r.income_date).slice(0,10),c:r.income_source||"Other",a:+r.amount,ds:r.description||""}));
const group=(a,k)=>Object.entries(a.reduce((o,x)=>(o[x[k]]=(o[x[k]]||0)+x.a,o),{})).sort((a,b)=>b[1]-a[1]);
function BG(){const r=R("Settings").find(r=>r.key==="budget");try{const o=JSON.parse(r.value);return{bud:o.bud||{},target:o.target??20}}catch(e){return{bud:{},target:20}}}
function saveB(B){upsert("Settings",{key:"budget",value:JSON.stringify(B)})}
/* ---- data ops ---- */
function upsert(n,row){if(!S.sh[n])S.sh[n]={cols:Object.keys(row),rows:[]};const T=S.sh[n],pk=T.cols[0],i=T.rows.findIndex(r=>r[pk]==row[pk]);i<0?T.rows.push(row):T.rows[i]=row;S.q.push({op:"up",sheet:n,row});save();sync()}
function remove(n,id){const T=S.sh[n],pk=T.cols[0];T.rows=T.rows.filter(r=>r[pk]!=id);S.q.push({op:"del",sheet:n,id});save();sync()}
function genId(n){const pk=pkOf(n),ids=R(n).map(r=>String(r[pk])),mt=ids.map(x=>/^(.*?)(\d+)$/.exec(x)).filter(Boolean);
if(n.startsWith("Master_")&&mt.length&&mt[0][2].length>=4){const p=mt[0][1],mx=Math.max(...mt.filter(x=>x[1]===p).map(x=>+x[2]));return p+String(mx+1).padStart(mt[0][2].length,"0")}
return(n.startsWith("Master_")?n.slice(7,10):n.slice(0,3)).toUpperCase()+"-"+Date.now().toString(36).toUpperCase()}
/* ---- sync ---- */
let busy=0,msg="",lastTap=0;["pointerdown","touchstart","keydown"].forEach(e=>addEventListener(e,()=>lastTap=Date.now(),{passive:true}));addEventListener("error",e=>toast("Error: "+e.message));const cfgOk=()=>S.cfg.url&&S.cfg.token;
function setStat(m){if(m!==undefined)msg=m;const t=busy?"⏳ Sync…":msg||(!cfgOk()?"☁️ Setup tab mein sheet link dalein":!navigator.onLine?"📴 Offline · "+S.q.length+" pending":S.q.length?"⏳ "+S.q.length+" pending":"✅ Sab sync hai");["st","st2"].forEach(i=>{const e=document.getElementById(i);if(e)e.textContent=t})}
async function sync(){if(busy||!cfgOk()||!navigator.onLine)return setStat("");busy=1;setStat("");
try{const ops=S.q.slice();if(ops.length){const r=await(await fetch(S.cfg.url,{method:"POST",body:JSON.stringify({token:S.cfg.token,ops})})).json();if(!r.ok)throw 0;S.q.splice(0,ops.length)}
const r=await(await fetch(S.cfg.url+"?token="+encodeURIComponent(S.cfg.token))).json();if(!r.ok)throw 0;if(!S.q.length)S.sh=r.sheets;save();busy=0;setStat("✅ Sab sync hai");if(S.q.length)return sync();if(["home","assets","ana"].includes(tab)&&!SH&&Date.now()-lastTap>2500&&!/INPUT|SELECT|TEXTAREA/.test(document.activeElement?.tagName||""))draw()}catch(e){busy=0;setStat("⚠️ Sync nahi hua (link/password check karein) · "+S.q.length+" pending");if(S.q.length)setTimeout(sync,15000)}}
addEventListener("online",sync);document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});
/* ---- entry form ---- */
let tab="home",cur="General_Expenses",edit={},q="",month=td.slice(0,7),SH=null;
function newRow(){edit={};const T=S.sh[cur];if(!T)return;const m=cur.startsWith("Master_"),l=S.last[cur]||{};T.cols.forEach(c=>{if(!m&&ctype(c)==="d"&&!Object.keys(edit).some(k=>ctype(k)==="d"))edit[c]=td;if(c==="is_active")edit[c]="TRUE";if(!m&&c!==T.cols[0]&&(FK[c]||/^(income_source|utility_type|provider)$/.test(c))&&l[c])edit[c]=l[c]})}
function opts(c,row){const t=FK[c];if(!t||!S.sh[t])return null;const pk=pkOf(t),nc=ncol(t);let rs=R(t).filter(r=>act(r.is_active));
S.sh[t].cols.forEach(k=>{if(k===pk||!/_id$/.test(k))return;const v=k==="parent_entity_id"?(row.vehicle_id||row.asset_id):row[k];if(v)rs=rs.filter(r=>r[k]==v)});return rs.map(r=>[r[pk],r[nc]])}
const hist=(c,row)=>{const kf=["subcategory_id","maintenance_detail_id","grocery_item_id","utility_type","income_source","vehicle_id","asset_id"].find(k=>S.sh[cur].cols.includes(k)&&row[k]);const o={};R(cur).filter(r=>!kf||r[kf]==row[kf]).forEach(r=>{const v=r[c];if(v!==""&&v!=null&&String(v).length<32)o[v]=(o[v]||0)+1});return Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,6).map(x=>x[0])};
const chips=(c,vals)=>vals.length?`<div class="chips">${vals.map(v=>`<span class="chip" onclick="setF('${c}',this.dataset.v)" data-v="${esc(v)}">${esc(v)}</span>`).join("")}</div>`:"";
function fld(c,row){const v=row[c]??"",ty=ctype(c),o=opts(c,row);let h,ex="";
if(o)h=`<select data-f="${c}" onchange="selCh('${c}',this.value)"><option value="">—</option>${o.map(([a,b])=>`<option value="${esc(a)}"${a==v?" selected":""}>${esc(b)}</option>`).join("")}<option value="__new">➕ Nayi add karein…</option></select>`;
else if(ty==="b")h=`<input type="checkbox" style="width:auto" data-f="${c}" ${String(v).toUpperCase()==="TRUE"?"checked":""}>`;
else if(ty==="d"){h=`<input type="date" data-f="${c}" value="${esc(v)}">`;ex=c==="next_service_date"&&row.service_date?chips(c,[1,3,6,12].map(m=>addM(row.service_date,m)).map(x=>x)).replace(/>(\d{4}-\d\d-\d\d)</g,(a,d)=>`>+${[1,3,6,12][[1,3,6,12].findIndex(m=>addM(row.service_date,m)===d)]} mahine<`):`<div class="chips"><span class="chip" onclick="setF('${c}','${td}')">Aaj</span><span class="chip" onclick="setF('${c}','${addM(td,0).slice(0,8)}${String(+td.slice(8)-1||1).padStart(2,"0")}')">Kal</span></div>`}
else if(ty==="n"){h=`<input type="number" step="any" inputmode="decimal" data-f="${c}" value="${esc(v)}">`;if(c==="amount")ex=chips(c,hist(c,row))}
else{const dl=hist(c,{});h=`<input data-f="${c}" value="${esc(v)}" autocomplete="off">`;ex=chips(c,/^(description|notes?)$/.test(c)?hist(c,row):[...new Set(R(cur).map(r=>r[c]).filter(Boolean))].slice(-6))}
return`<div><label>${c.replace(/_id$/,"").replace(/_/g," ")}</label>${h}${ex}</div>`}
function form(){const T=S.sh[cur];if(!T)return"<p class='mu'>Pehle Setup mein sheet link dalein.</p>";return`${T.cols.slice(1).filter(c=>!AUTO.includes(c)).map(c=>fld(c,edit)).join("")}<button class="p" onclick="saveRow()">💾 ${edit[T.cols[0]]?"Update karein":"Save karein"}</button>${edit[T.cols[0]]?'<button class="s" style="width:100%;margin-top:8px;padding:11px" onclick="newRow();draw()">Cancel / Naya</button>':""}`}
function read(){S.sh[cur].cols.forEach(c=>{const e=document.querySelector(`[data-f="${c}"]`);if(!e)return;edit[c]=e.type==="checkbox"?(e.checked?"TRUE":"FALSE"):e.value})}
function refresh(){const e=$("#fm");if(e)e.innerHTML=form()}
function setF(c,v){read();edit[c]=v;autofill(c);refresh()}

function draw(){let v;try{v={home,add:addView,rec:recView,assets:assetsView,ana:anaView,set:setView}[tab]()}catch(e){v=`<div class="card er"><b>Error:</b> ${esc(e.message)}<br><small>${esc((e.stack||"").split("\n")[1]||"")}</small><button class="p" onclick="location.reload()">Reload</button></div>`}$("#app").innerHTML='<div id="st" class="mu" style="text-align:right;font-size:12px"></div>'+v;setStat();
$("#nav").innerHTML=[["home","🏠","Home"],["add","➕","Entry"],["rec","🧾","Records"],["assets","🚗","Assets"],["ana","📊","Analysis"],["set","⚙️","Setup"]].map(([k,i,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';if(k==='add'&&!Object.keys(edit).length)newRow();draw();scrollTo(0,0)"><span>${i}</span>${l}</button>`).join("")}
if(!S.sh[cur]&&S.sh.General_Expenses)cur="General_Expenses";if(!cfgOk())tab="set";newRow();draw();sync();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
