<style>
:root{--bg:#eef3fb;--card:#fff;--tx:#14181f;--mu:#6b7280;--ac:#0f766e;--ac2:#0ea5e9;--bd:#e5e7eb;--ok:#15803d;--wa:#b45309;--er:#b91c1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1116;--card:#181c23;--tx:#eef0f3;--mu:#98a1ae;--ac:#2dd4bf;--ac2:#38bdf8;--bd:#2a303a;--ok:#4ade80;--wa:#fbbf24;--er:#f87171}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
main{max-width:640px;margin:0 auto;padding:14px}h1{font-size:22px;margin:4px 0 12px;background:linear-gradient(90deg,var(--ac),#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}h2{font-size:13px;color:var(--mu);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(15,118,110,.08)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px}.k small{color:var(--mu);font-size:12px}.k b{display:block;font-size:18px;margin-top:2px}

${H("🛒 Grocery: rate mein farq",
  (pc.length?pc.map(x=>`<div class="row"><span>${esc(x.n)}</span><b class="${x.ch>0?"er":"ok"}">${x.ch>0?"🔺":"🔻"} ${Math.abs(x.ch).toFixed(0)}% <small>(ab ${f(x.p)})</small></b></div>`).join(""):"")+
  (gi.length?`<div style="margin-top:8px"><small class="mu">Is mahine sab se zyada kharcha:</small>${gi.map(([k,a])=>`<div class="row"><span>${esc(k)}</span><b>${f(a)}</b></div>`).join("")}</div>`:""),
  "Pehle hisse mein rate 5%+ badla; neeche is mahine ke top items.")}

${H("🔁 Baar-baar wale kharchay",
  lk.map(([k,v])=>`<div class="row"><div>${esc(k)}<br><small>${v.n} baar · avg ${f(v.a/v.n)}</small></div><b>${f(v.a)}</b></div>`).join(""),
  "Chhoti baar-baar ki cheezein jama hokar bara kharcha ban jati hain. In par nazar rakhna cash-flow behtar karta hai.")}

${an.length?`<h2>🕵️ Ghair-mamooli kharchay</h2>${an.map(x=>`<div class="in warn"><span>🕵️</span><div><b>${f(x.a)}</b> — ${esc(x.ds||x.s)} (${x.d})<br><small>${esc(x.c)} › ${esc(x.s)} ka aam level is se kaafi kam rehta hai</small></div></div>`).join("")}`:""}

${H("🏆 Top 8 kharchay",
  [...ex].sort((a,b)=>b.a-a.a).slice(0,8).map(x=>`<div class="row"><div>${ico(x.c,24)}${esc(x.ds||x.s)}<br><small>${x.d} · ${esc(x.c)}</small></div><b>${f(x.a)}</b></div>`).join(""))}
`;
}
function guide(){const A=(t,b,o)=>`<details class="acc" ${o?"open":""}><summary>${t}</summary>${b}</details>`,F=(x,e)=>`<span class="fm">${x}</span>${e?`<p class="ex">${e}</p>`:""}`,P=(n,t,b)=>`<div class="stp"><i>${n}</i><div><b>${t}</b><br><small class="mu">${b}</small></div></div>`;
return`<div class="gh"><h1>❓ Guide</h1><div style="opacity:.92">Is app ko istemal karna aur har number ka matlab — sab yahan hai.</div></div>
<h2>🚀 3 minute mein shuru</h2><div class="card">${P(1,"Entry tab kholein","Upar 3 bare buttons: 🧾 Kharcha · 💰 Income · 📝 Shopping list. Kharcha par tap karein: pehle category (ya upar search box mein naam likhein), phir sub-category, phir sahi form khud khulta hai (Petrol par petrol ka form, Bijli par bill ka).")}${P(2,"Chips tap karein, type kam","Amount, rate, description aur tareekh ke neeche jo chips aate hain wo aap ki purani entries se bante hain. Bas tap karein.")}${P(3,"Save karein","Save par aaj ka kharcha aur streak nazar aati hai. Galti ho to 5 second ke andar <b>Undo</b> dabayein.")}</div>
${A("✍️ Entry ki tricks (typing kam)",`<ul><li><b>Pichli values khud bhar jati hain:</b> payment method, gaari, category waghera aakhri entry se.</li><li><b>🔁 Dobara wohi:</b> Entry ya Records mein 🔁 dabayein, purani entry aaj ki tareekh ke saath copy ho jati hai.</li><li><b>➕ Nayi add karein:</b> har dropdown ke aakhir mein. Nayi category/gaari/store/pump foran sheet mein chali jati hai.</li><li><b>Aur details (optional):</b> notes, store, pump jaisi cheezain band rehti hain, zaroorat ho to kholein.</li><li><b>Service ki agli tareekh:</b> "+3 mahine" jaise chips.</li><li><b>Shopping list ✅:</b> cheez kharidne par ✅ dabayein, grocery form khud bhar jata hai.</li></ul>`,1)}
${A("🧮 'Do bharein, teesri khud' — kaise?",`<p class="ex">Petrol, grocery aur aam kharche mein Miqdar, Rate aur Amount ka ek tikon hota hai. Jo <b>do</b> aap bharein, teesri khud ban jati hai (hari ho jati hai).</p>${F("Amount = Miqdar × Rate","Petrol: 18 L × Rs 275 = Rs 4,950")}${F("Miqdar = Amount ÷ Rate","Rs 5,000 ÷ Rs 275 = 18.18 L")}${F("Rate = Amount ÷ Miqdar","Rs 4,950 ÷ 18 L = Rs 275 / L")}<b>Gram aur ml:</b><p class="ex">Agar unit Gram ya Millilitre chunein to rate kilo / litre ka samjha jata hai (market ki tarah) aur hisaab ÷ 1000 se hota hai.</p>${F("Amount = gram × (rate per kg) ÷ 1000","250 g × Rs 800/kg ÷ 1000 = Rs 200")}${F("Doodh: Amount = litre × rate","2 L × Rs 220 = Rs 440")}<p class="ex">Petrol mein pichla rate aur grocery mein pichli cheez ka rate/unit khud aa jata hai. Is liye aksar sirf amount ya wazan likhna kaafi hota hai.</p>`)}
${A("⛽ Gaari ke numbers",`${F("Mileage (km/L) = (aakhri odometer − pehla odometer) ÷ litres","Litres mein pehli fill shamil nahi (wo pichle safar ka petrol hai).")}${F("Cost per km = (petrol ka kharcha + maintenance) ÷ chale hue km","Petrol mein bhi pehli fill shamil nahi.")}${F("Har fill ka km/L = (is fill ka odometer − pichla odometer) ÷ is fill ke litres","Maan liya jata hai ke har dafa tanki full ki.")}<p class="ex">Mileage ke liye har petrol entry mein odometer likhna zaroori hai.</p>`)}
${A("🏠 Dashboard ke numbers",`${F("Budget mein bacha = budget − budget wali cheezon ka kharcha","Jin cheezon ka budget nahi rakha, unka kharcha 'baqi (bina budget)' mein alag dikhta hai.")}${F("Bachat = income − kul kharcha (sab kuch ginke)")}${F("Mahina = aap ki chuni hui tareekh se agli tareekh tak","Setup → Mahina kis tareekh se shuru. Maslan 25 chunein to 25 Oct se 24 Nov tak 'Nov' ka mahina hai.")}${F("Pichle mahine ka bacha hua = pichle mahine ki income − kharcha")}${F("Aaj ka safe limit = bacha hua budget ÷ mahine ke baqi din (aaj samet)","Is se zyada aaj kharch karein to budget bhaari par sakta hai.")}${F("Month-end projection = ab tak ka kharcha ÷ guzre din × mahine ke kul din","Kam az kam 5 din guzarne ke baad dikhai deta hai.")}${F("Bachat % = (income − kharcha) ÷ income")}${F("🔥 Streak = lagataar kitne din kam az kam ek entry ki","Aaj abhi na ki ho to kal tak ki streak chalti rehti hai.")}`)}
${A("🌟 Financial health score (0–100)",`<p class="ex">Teen cheezon ka milaap hai:</p>${F("40 points: bachat % ÷ aap ka target (max 40)")}${F("40 points: kitni budget wali categories budget ke andar hain")}${F("20 points: pichle 14 din mein kitne din entry ki (10 din = poore 20)")}<p class="ex">80 se zyada = Zabardast 🌟, 60 se zyada = Theek-thaak 👍, us se kam = Dhyan dein ⚠️. Agar income nahi likhi to bachat ke hisse ke 20 points diye jate hain.</p>`)}
${A("🎯 Budget lagana",`<ul><li>Setup → <b>Meri budget list</b> → <b>➕ Budget add karein</b>.</li><li>Category chunein, phir "Poori category" ya koi ek sub-category, phir mahana amount.</li><li>List mein sirf wohi cheezein hoti hain jin ka aap ne budget rakha. Amount badalne ke liye us par likhein, hatane ke liye ✕.</li></ul><p class="ex">Agar category ka budget aur uski sub-category ka budget dono hon, to poori category ka budget category ki hadd hai aur sub-category ka budget us ek cheez ki.</p>`)}
${A("📝 Shopping list (pool se)",`<ul><li><b>Pool</b> = aap ke saare items (Master Grocery Items). Grocery kharche ke form mein item chunte ya ➕ banate waqt wohi pool barhta hai.</li><li>Entry → 📝 Shopping list → <b>➕ Pool se item chunein</b>. Upar search (naam ya group), group ke chips, ya ➕ Doosri category. Item par tap → unit, miqdar, description → <b>List mein daalein</b>. Pool mein items hamesha rehte hain.</li><li><b>🛒 Poori list kharcha mein darj karein:</b> har item ka rate ya amount likhein (ek likhein, doosra khud ban jata hai), tareekh aur payment method ek dafa, phir ek tap. Har item apni category mein alag entry ban jata hai. Jin ka amount khali ho wo list mein rehte hain.</li><li><b>🔁 Dobara list banayein:</b> kharid kiye hue items wapas list mein (har mahine ki list ke liye).</li><li><b>🗑 Poori list saaf karein:</b> ek button se poori list mit jati hai (pool ke items rehte hain).</li><li>List ki har line: <b>naam — wazan unit — description</b>.</li><li><b>📋 Copy / 📤 Share / 🖨️ Print:</b> list kahin bhi bhejein. <b>Zabaan</b> اردو ya Roman, aur <b>Line</b> "Naam pehle" ya "Miqdar pehle". Jo andaaz aap ke WhatsApp par sahi dikhe wohi rakhein.</li></ul>`)}
${A("🧺 Pool kya hai",`<ul><li><b>Pool</b> tab mein aap ke <b>items</b>, <b>categories (sub-categories samet)</b> aur <b>units</b> ek jagah hain: add, edit, band ya delete.</li><li>Shopping list, grocery kharcha aur aam kharche ki description sab isi pool se chunte hain (search ya group ke chips se), ya aap naya likh sakte hain.</li><li><b>Naya item kahin se bhi banayein</b> (shopping, grocery form, kharche ki description) to wo khud pool mein save hota hai. Aam kharche mein jo description likhein wo us sub-category ke group mein pool mein chali jati hai (Setup mein iska on/off hai).</li><li>Agar do categories mein ek hi naam ki sub-category ho to group "Category › Sub" ke naam se banta hai.</li></ul>`)}
${A("✏️ Edit aur delete",`<ul><li>Entry → Kharcha par <b>✏️ Edit mode</b> dabayein, phir kisi category ya sub-category par tap karke naam badlein, band karein (Active ka tick hatayein) ya delete karein.</li><li>Shopping ke pool mein bhi <b>✏️ Edit mode</b>; unit chunte waqt <b>⚙️ Units</b> mein unit badlein ya ➕ naya banayein.</li><li><b>Delete sirf tab</b> jab us par koi entry na ho. Warna app batati hai kitni entries judi hain, aur "Active" ka tick hata kar band karne ka kehti hai, taake purana hisaab na bigre.</li><li>Naam badalne par budget aur items ke group khud naye naam par aa jate hain.</li></ul>`)}
${A("🎨 Rang ka matlab (highlight kab hota hai)",`<p><span class="badge wa">80%</span> Budget ka 80% ya zyada use ho gaya, abhi cross nahi hua.</p><p><span class="badge er">Budget cross</span> Budget se zyada kharcha.</p><p class="ex">Baaqi sab normal rehta hai, sirf wahi cheezain rang mein aati hain jin par dhyan dena hai. Budget Setup tab mein set hota hai (category › sub-category).</p>`)}
${A("📊 Analysis ke charts kaise parhein",`<ul><li><b>Budget raftar:</b> laal line (aap ka kharcha) dotted line (budget ki seedhi raftar) se upar ho to aap aage chal rahe hain.</li><li><b>Donut:</b> kharcha category ke hisaab se kitna hissa.</li><li><b>Category vs Budget:</b> kaali line budget ki hadd hai.</li><li><b>6 mahine:</b> hara income, laal kharcha.</li><li><b>Rozana kharcha:</b> dotted line rozana budget; laal bar = limit se zyada din.</li><li><b>Gaari:</b> petrol ke rate ka trend aur har fill ka mileage.</li><li><b>Grocery rate:</b> pichli do khareedariyon ke rate mein 5% se zyada farq.</li><li><b>Ghair mamooli kharchay:</b> us sub-category ki kam az kam 5 purani entries ka average aur 2×standard deviation se bhi zyada, aur average ke 1.5 guna se zyada.</li><li><b>Baar baar wale kharchay:</b> mahine mein 5 ya zyada baar aane wali sub-category.</li></ul>`)}
${A("⏰ Reminders kab aate hain",`<ul><li>🔧 Service ki agli tareekh 30 din ke andar (ya guzar chuki).</li><li>🛡️ Warranty khatam hone mein 60 din ya kam.</li><li>💡 Bill ki due date 7 din ke andar aur payment date khali.</li></ul><p class="ex">Reminders ke liye service entry mein "next service date" aur bill mein "due date" bharein.</p>`)}
${A("💡 Bills (bijli, gas, paani, internet)",`<ul><li>Pehle <b>bill ki qism</b> ke chips mein se chunein. Ye list Utility Bills ki sub-categories se bhi bharti hai, nayi cheez ke liye ➕ Nayi.</li><li><b>Bijli aur Gas:</b> meter hota hai. Pichli reading khud aa jati hai, aap sirf <b>aaj ki reading</b> likhein.</li></ul>${F("Istemal = aaj ki reading − pichli reading","Bijli: unit kWh; Gas: unit CM (cubic meter).")}<ul><li><b>Paani:</b> meter na ho to tanker ke <b>gallons</b> likhein (unit Gallon khud lag jata hai).</li><li><b>Internet:</b> speed (Mbps) likhein.</li><li>Pichle bill ka provider aur agli due date (+1 mahina) khud bhar jate hain.</li><li>Payment date khali rahe to bill "unpaid" ginta hai aur due date se pehle reminder aata hai; ada kar dein to payment date bhar dein.</li></ul>`)}
${A("🗂️ Categories badalna",`<p class="ex">Setup tab → Masters mein jo list chahein khol kar edit karein, ya Google Sheet mein seedha Master_Categories / Master_Subcategories badal dein. Purani category band karni ho to delete ke bajaye <b>is_active = FALSE</b> karein, taake purana hisaab na bigre.</p>`)}
${A("☁️ Sync aur offline",`<ul><li>Internet ho ya na ho, app khulti hai aur entries phone mein save hoti hain. Upar "📴 Offline · 3 entries pending" likha aata hai.</li><li>Internet aate hi, ya app kholne par, pending entries khud Google Sheet mein chali jati hain. Upar 🔄 dabakar bhi abhi sync kar sakte hain.</li><li>"✅ Sab sync hai" likha ho to sab sheet mein hai. Setup mein "Sync status" dikhata hai kis sheet ki kitni entries pending hain aur kaun si entry kyun nahi gayi. Jo entry sheet mein na gayi ho wo Records mein narangi (bhejna baqi) ya laal (sync nahi hua) nishan ke saath nazar aati hai.</li><li>Offline chalne ke liye app ko ek dafa internet par khol lein, aur home screen par add rakhein.</li><li>"⚠️ Sync nahi hua" aaye to internet ya Setup mein link/password check karein; entries phone mein mehfooz rehti hain.</li></ul>`)}
${A("🙋 Aam sawal",`<p><b>Entry galat ho gayi?</b><br><small class="mu">Save ke fauran baad Undo, ya Records mein ✏️ / 🗑.</small></p><p><b>Do phone par chalaun?</b><br><small class="mu">Haan, dono mein wohi link aur password dalein.</small></p><p><b>Mera data kahan hai?</b><br><small class="mu">Aap ki apni Google Sheet mein, kisi aur server par nahi.</small></p>`)}`}
/* ---- setup ---- */
function setView(){const B=BG(),ks=Object.keys(B.bud).sort();
return`<h1>Setup</h1><div class="card"><small class="mu" id="st2"></small><label>Google Apps Script URL (…/exec)</label><input id="cu" value="${esc(S.cfg.url)}" autocapitalize="off">${urlChk(S.cfg.url)?`<small class="er">⚠️ ${urlChk(S.cfg.url)}</small>`:""}<label>Password (TOKEN)</label><input id="ct" value="${esc(S.cfg.token)}" autocapitalize="off"><button class="p" onclick="S.cfg.url=$('#cu').value.trim();S.cfg.token=$('#ct').value.trim();save();toast('Sync shuru…');sync(1)">Save &amp; Sync</button></div>
<div class="card"><b>📡 Sync status</b><div id="sq">${pendHtml()}</div><button class="p" onclick="sync(1)">🔄 Abhi sync karein</button><button class="p" style="background:var(--card);color:var(--tx);border:1px solid var(--bd)" onclick="srvCheck()">🔍 Server jaanch (naya Code.gs chal raha hai?)</button></div>
<h2>🎯 Meri budget list</h2><div class="card"><small class="mu">Sirf wohi cheezein jin ka budget aap rakhna chahte hain. Poori category ya koi ek sub-category.</small>${ks.map(k=>`<div class="row"><span>${esc(k.replace("|"," › "))}</span><span style="white-space:nowrap"><input type="number" inputmode="decimal" style="width:100px;text-align:right" value="${B.bud[k]}" data-k="${esc(k)}" onchange="const b=BG();+this.value?b.bud[this.dataset.k]=+this.value:delete b.bud[this.dataset.k];saveB(b);draw()"> <button class="s er" data-k="${esc(k)}" onclick="const b=BG();delete b.bud[this.dataset.k];saveB(b);draw()">✕</button></span></div>`).join("")||'<div class="mu" style="padding:10px 0">Budget list khali hai.</div>'}${ks.length?`<div class="row"><b>Kul budget</b><b>${f(btot(B))}</b></div>`:""}<button class="p" onclick="budAdd()">➕ Budget add karein</button></div>
<div class="card"><label style="display:flex;gap:8px;align-items:center;color:var(--tx)"><input type="checkbox" style="width:auto" ${S.autoPool===false?"":"checked"} onchange="S.autoPool=this.checked;save()"> Kharche ki description khud pool mein add ho</label></div><div class="card"><label>Mahina kis tareekh se shuru ho?</label><select onchange="const b=BG();b.start=+this.value;saveB(b);mUser=false;draw()">${Array.from({length:28},(_,i)=>`<option value="${i+1}" ${B.start===i+1?"selected":""}>${i?i+1+" tareekh":"1 (calendar mahina)"}</option>`).join("")}</select><small class="mu">Jaise tankhwah 25 ko aati hai to 25 chunein: 25 Oct se 24 Nov tak "Nov" ka mahina hoga.</small></div><div class="card"><label>Savings target %</label><input type="number" value="${B.target}" onchange="const b=BG();b.target=+this.value||0;saveB(b)"></div>
<h2>Masters customize karein</h2><div class="card"><div class="chips">${["Categories","Subcategories","Vehicles","Household_Assets","Parts_Systems","Maint_Categories","Maint_Details","Fuel_Stations","Grocery_Items","Stores","Suppliers","Payment_Methods","Units"].map(x=>`<span class="chip" onclick="mst('Master_${x}')">${x.replace(/_/g," ")}</span>`).join("")}</div><small class="mu">Record par ✏️ se edit karein; naya add karne ke liye form mein ➕ Nayi use karein. Band karne ke liye is_active = FALSE.</small></div>`}
function budAdd(){bdS={c:(R("Master_Categories").find(x=>act(x.is_active))||{}).category_id||"",s:"",a:""};budSheet()}
function budSheet(){const C=R("Master_Categories").filter(x=>act(x.is_active)),SB=R("Master_Subcategories").filter(x=>x.category_id===bdS.c&&act(x.is_active));if(!C.length)return toast("Categories load nahi hui");sheet("➕ Budget add karein",`<label>Category</label><select onchange="bdS.a=$('#ba').value;bdS.c=this.value;budSheet()">${C.map(c=>`<option value="${esc(c.category_id)}" ${c.category_id===bdS.c?"selected":""}>${esc(c.category_name)}</option>`).join("")}</select><label>Sub-category</label><select id="bs"><option value="">Poori category</option>${SB.map(x=>`<option value="${esc(x.subcategory_id)}">${esc(x.subcategory_name)}</option>`).join("")}</select><label>Mahana budget (Rs)</label><input id="ba" type="number" inputmode="decimal" value="${esc(bdS.a)}" placeholder="jaise 20000"><button class="p" onclick="budSave()">Save karein</button>`)}
function budSave(){if(!$("#ba")||!$("#bs"))return;const a=+$("#ba").value;if(!(a>0))return toast("Budget likhein");const c=R("Master_Categories").find(x=>x.category_id===bdS.c),sid=$("#bs").value,sb=sid&&R("Master_Subcategories").find(x=>x.subcategory_id===sid),B=BG();B.bud[sb?c.category_name+"|"+sb.subcategory_name:c.category_name]=a;saveB(B);closeSh();toast("Budget set ho gaya ✓");draw()}
function draw(){_sd=null;let v;try{v={home,add:addView,rec:recView,assets:assetsView,ana:anaView,set:setView,guide,pool:poolView}[tab]()}catch(e){v=`<div class="card er"><b>Error:</b> ${esc(e.message)}<br><small>${esc((e.stack||"").split("\n")[1]||"")}</small><button class="p" onclick="location.reload()">Reload</button></div>`}$("#app").innerHTML='<div class="top"><div><b>💰 Hisaab</b><div id="st"></div></div><div style="display:flex;gap:6px"><button class="s" onclick="toast(\'Sync shuru…\');sync(1)">🔄</button><button class="s" onclick="tab=\'guide\';draw();scrollTo(0,0)">❓ Guide</button></div></div>'+v;setStat();
$("#nav").innerHTML=[["home","🏠","Dashboard"],["add","➕","Entry"],["rec","🧾","Records"],["assets","🚗","Assets"],["pool","🧺","Pool"],["ana","📊","Analysis"],["set","⚙️","Setup"]].map(([k,i,l])=>`<button class="${tab===k?"on":""}" onclick="tab='${k}';if('${k}'==='rec')recM=0;if('${k}'==='add'&&!Object.keys(edit).length)newRow();draw();scrollTo(0,0)"><span>${i}</span>${l}</button>`).join("")}
if(!S.sh[cur]&&S.sh.General_Expenses)cur="General_Expenses";if(!cfgOk())tab="set";newRow();draw();sync(1);
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
